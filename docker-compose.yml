services:
  blog:
    image: nginx:alpine
    container_name: daily-blog
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge
