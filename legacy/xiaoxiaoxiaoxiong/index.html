<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Xiaoxiong的个人主页</title>
    <script src="./lib/jquery.min.js"></script>
    <!-- 星星特效 -->
    <script src="./lib/jquery-canvas-sparkles.js"></script>
    <script src="./src/sparkle.js"></script>
    <link rel="stylesheet" href="./asset/styles/index.css" />
    <script>
      (function () {
        var token = window.CLOUDFLARE_WEB_ANALYTICS_TOKEN || "REPLACE_WITH_CF_WEB_ANALYTICS_TOKEN";
        if (!token || token.indexOf("REPLACE_WITH_") === 0) return;
        var beacon = document.createElement("script");
        beacon.defer = true;
        beacon.src = "https://static.cloudflareinsights.com/beacon.min.js";
        beacon.setAttribute("data-cf-beacon", JSON.stringify({ token: token }));
        document.head.appendChild(beacon);
      })();
    </script>
  </head>
  <body>
    <div class="star-background"></div>
    <div class="content">
      <a href="https://daily.xiaoxiong.app" class="logo-link" title="Xiaoxiong 的日常">
        <img src="./asset/images/Nichijou_logo.svg" alt="Nichijou Logo" class="logo" />
      </a>

      <div class="footer">
        Xiaoxiong©2018－2019
      </div>
      <div class="player">
        <iframe
          class="netease-music"
          frameborder="no"
          border="0"
          marginwidth="0"
          marginheight="0"
          width="280"
          height="52"
          src="//music.163.com/outchain/player?type=2&id=651241&auto=0&height=32"
        ></iframe>
      </div>
    </div>
  </body>
</html>
